{% extends "base.html" %}

{% block title %}404 Not Found — MediDesk{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 80px auto; padding: 0 16px; text-align: center;">
  <div class="card" style="padding: 40px 24px;">
    <div style="font-size: 3rem; margin-bottom: 12px;">🔍</div>
    <h1 style="font-size: 2.2rem; font-weight: 800; color: var(--primary-navy); margin-bottom: 8px;">404</h1>
    <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--primary-navy); margin-bottom: 12px;">Resource Not Found</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px;">

    </p>

    <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Safety</a>

</div>
{% endblock %}
